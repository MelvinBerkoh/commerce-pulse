services:
  postgres:
    image: postgres:16
    container_name: commerce-pulse-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: commerce_pulse
      POSTGRES_USER: commerce_user
      POSTGRES_PASSWORD: commerce_password

    ports:
      - "5432:5432"

    volumes:
      - commerce_pulse_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U commerce_user -d commerce_pulse"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  commerce_pulse_postgres_data: