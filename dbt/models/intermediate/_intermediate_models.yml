version: 2

models:
  - name: int_payments_per_order
    description: >
      Payment records aggregated to one row per order to prevent
      fan-out when joined to other order-level datasets.

    columns:
      - name: order_id
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id

      - name: total_payment_value
        data_tests:
          - not_null

      - name: payment_record_count
        data_tests:
          - not_null

  - name: int_reviews_per_order
    description: >
      Review records aggregated to one row per order.

    columns:
      - name: order_id
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id

      - name: review_count
        data_tests:
          - not_null

      - name: average_review_score
        data_tests:
          - not_null

  - name: int_geolocation_by_zip
    description: >
      Geographic lookup containing one representative location
      per ZIP code prefix.

    columns:
      - name: geolocation_zip_code_prefix
        data_tests:
          - not_null
          - unique

      - name: latitude
        data_tests:
          - not_null

      - name: longitude
        data_tests:
          - not_null

  - name: int_orders_enriched
    description: >
      Order-level analytical dataset enriched with customer,
      payment, review, and delivery information.

    columns:
      - name: order_id
        data_tests:
          - not_null
          - unique

      - name: customer_id
        data_tests:
          - not_null

      - name: customer_unique_id
        data_tests:
          - not_null

      - name: order_status
        data_tests:
          - not_null

      - name: purchased_at
        data_tests:
          - not_null
